            useEffect(() => {
                if (isExhaling) {
                    if (!exhaleStartTime) { setExhaleStartTime(Date.now()); }

                        setHistory(prev => [...prev.slice(-9), duration]);

                    setExhaleStartTime(null);

            const handleExhaleStart = (e) => {

            return (

                            </button>

        const NitroxUtils = {
            getATA: (depth, units) => {
                const depthMeters = (units === 'metric') ? parseFloat(depth) : (parseFloat(depth) / 3.28084);
                if (isNaN(depthMeters) || depthMeters < 0) return 1;
                return (depthMeters / 10) + 1;
            },
        };


        const CalculatorScreen = () => {
            const { isPro, promptProModal } = useBilling();
            const [screen, setScreen] = useState('disclaimer');
            const [activeTab, setActiveTab] = useState('calc');
            const [units, setUnits] = useState('metric');
            const [modO2, setModO2] = useState('32');
            const [modPPO2, setModPPO2] = useState('1.4');
            const [eadDepth, setEadDepth] = useState('30');
            const [eadO2, setEadO2] = useState('32');


            const modResult = useMemo(() => {
                const o2 = parseFloat(modO2) / 100;
                const ppo2 = parseFloat(modPPO2);
                if (isNaN(o2) || o2 <= 0 || o2 > 1 || isNaN(ppo2) || ppo2 <= 0) return 0;
                const ata = ppo2 / o2;
                if (ata < 1) return 0;
                const depthMeters = (ata - 1) * 10;
                return (units === 'metric') ? depthMeters : (depthMeters * 3.28084);
            }, [modO2, modPPO2, units]);


            const eadResult = useMemo(() => {
                const d = parseFloat(eadDepth);
                const o2 = parseFloat(eadO2) / 100;
                if (isNaN(d) || d < 0 || isNaN(o2) || o2 < 0.21 || o2 > 1) return 0;
                const n2 = 1 - o2;
                if (units === 'metric') return ((d + 10) * (n2 / 0.79)) - 10;
                else return ((d + 33) * (n2 / 0.79)) - 33;
            }, [eadDepth, eadO2, units]);


            if(screen === 'disclaimer') return (<div className="w-full max-w-sm mx-auto text-center p-4 flex flex-col justify-center h-full fade-in"><h1 className="text-2xl font-bold text-yellow-400 mb-4">{t.calc_disclaimer_title}</h1><div className="text-left text-sm text-gray-200 space-y-3 bg-gray-800 p-5 rounded-2xl shadow-lg"><p><span dangerouslySetInnerHTML={{__html: t.calc_disclaimer_1}}/></p><p>{t.calc_disclaimer_2}</p><p>{t.calc_disclaimer_3}</p></div><button onClick={() => isPro ? setScreen('calc') : promptProModal()} className={`w-full font-bold py-3 rounded-xl shadow-lg mt-6 ${isPro ? 'bg-yellow-500 text-black' : 'bg-cyan-500 text-black'}`}>{isPro ? t.calc_agree_btn : t.pro_title}</button></div>);


            return (
                <div className="w-full max-w-sm mx-auto text-left p-4 pb-24 overflow-y-auto h-full fade-in">

                        <button onClick={() => setUnits('imperial')} className={`py-2 px-6 rounded-r-full font-semibold ${units === 'imperial' ? 'bg-cyan-500 text-gray-900' : 'bg-gray-700 text-white'}`}>{t.planner_unit_ft}</button>
                    </div>

                                </div>

                return (parseFloat(log.maxDepth) * 3.2808).toFixed(0);

                                        <div><span className="text-gray-400">Cylinder:</span> <span className="text-white">{selectedLog.cylinder || '-'}</span></div>

                                </div>

                                        <div><span className="text-gray-400">Visibility:</span> <span className="text-white">{selectedLog.visibility || '-'}</span></div>
                                        <div><span className="text-gray-400">Boat Type:</span> <span className="text-white">{selectedLog.boatType || '-'}</span></div>
                                        <div><span className="text-gray-400">Entry:</span> <span className="text-white">{selectedLog.entryStyle || '-'}</span></div>

                                </div>

                                    <div><label className="text-xs text-gray-400">{t.logbook_surge}</label><input type="text" value={formData.surge} onChange={e => setFormData({...formData, surge: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm" /></div>
                                    <div><label className="text-xs text-gray-400">{t.logbook_current}</label><input type="text" value={formData.current} onChange={e => setFormData({...formData, current: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm" /></div>
                                    <div><label className="text-xs text-gray-400">{t.logbook_visibility}</label><input type="text" value={formData.visibility} onChange={e => setFormData({...formData, visibility: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm" /></div>
                                    <div><label className="text-xs text-gray-400">{t.logbook_boat}</label><input type="text" value={formData.boatType} onChange={e => setFormData({...formData, boatType: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm" /></div>
                                    <div><label className="text-xs text-gray-400">{t.logbook_entry}</label><input type="text" value={formData.entryStyle} onChange={e => setFormData({...formData, entryStyle: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm" /></div>
                                </div>
                            </div>

                            <div className="bg-gray-800 p-4 rounded-xl shadow-md border border-gray-700">
                                <h3 className="text-cyan-400 font-bold mb-3 text-sm border-b border-gray-700 pb-1">Verification</h3>
                                <div className="space-y-3">
                                    <div><label className="text-xs text-gray-400">{t.logbook_instructor}</label><input type="text" value={formData.instructorId} onChange={e => setFormData({...formData, instructorId: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm" /></div>
                                    <div><label className="text-xs text-gray-400">{t.logbook_notes}</label><textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full bg-gray-900 text-white p-2 rounded-lg text-sm h-24"></textarea></div>
                                    
                                    <div className="bg-gray-900 p-3 rounded-lg border-l-4 border-yellow-500 mt-4">
                                        <h4 className="text-yellow-500 font-bold text-xs mb-1">{t.logbook_disclaimer_title}</h4>
                                        <p className="text-[10px] text-gray-400 mb-2 leading-tight">{t.logbook_disclaimer_text}</p>
                                        <label className="flex items-center space-x-2 cursor-pointer">
                                            <input type="checkbox" checked={formData.disclaimerAgreed} onChange={e => setFormData({...formData, disclaimerAgreed: e.target.checked})} className="w-4 h-4 accent-cyan-500" />
                                            <span className="text-xs text-white font-medium">{t.logbook_disclaimer_agree}</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <button disabled={!formData.disclaimerAgreed} onClick={handleSave} className={`w-full font-bold py-4 rounded-xl shadow-lg mt-4 transition-all ${formData.disclaimerAgreed ? 'bg-cyan-500 text-gray-900 hover:bg-cyan-400' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}`}>
                                {t.logbook_save}
                            </button>
                        </div>
                    </div>
                );
            }

                                <div className="absolute top-0 left-0 w-1 h-full bg-cyan-500"></div>
                                <div className="absolute top-1/2 right-4 -translate-y-1/2 text-gray-600 group-hover:text-cyan-400 transition-colors">
                                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                                </div>
                                <div className="flex justify-between items-start mb-2 pl-2 pr-6">
                                    <div>
                                        <h3 className="text-white font-bold text-lg">{t.logbook_dive_num} {log.diveNumber}</h3>
                                        <p className="text-gray-400 text-xs">{log.date} • {log.location || 'Unknown'}</p>
                                    </div>
                                    <span className="bg-gray-900 text-cyan-300 text-xs font-bold px-2 py-1 rounded">{log.bottomTime} min</span>
                                </div>
                                <div className="flex gap-4 mt-3 pt-3 border-t border-gray-700 pl-2 pr-6">
                                    <div><span className="block text-[10px] text-gray-500 uppercase">{t.logbook_max_depth}</span><span className="text-sm text-gray-200 font-semibold">{getConvertedDepth(log, units)} {units === 'metric' ? 'm' : 'ft'}</span></div>
                                    <div><span className="block text-[10px] text-gray-500 uppercase">{t.logbook_gas_mix}</span><span className="text-sm text-gray-200 font-semibold">% {log.gasMix}</span></div>
                                </div>
                            </div>
                        ))}
                        {logs.length === 0 && <div className="text-gray-500 text-sm text-center py-8">{t.logbook_empty}</div>}
                    </div>
                </div>
            );
        };


        const SupportScreen = () => (<div className="w-full max-w-sm mx-auto text-left p-4 overflow-y-auto h-full pb-24 fade-in"><h1 className="text-3xl font-bold text-white mb-2 text-center">{t.support_title}</h1><h2 className="text-lg font-semibold text-cyan-300 mb-4 text-center">{t.support_subtitle}</h2><p className="text-base text-gray-300 mb-6 text-center">{t.support_mission_text}</p><div className="bg-gray-800 p-5 rounded-2xl shadow-lg mb-4"><h2 className="text-lg font-bold text-cyan-300 mb-2">{t.support_opt1_title}</h2><p className="text-sm text-gray-300 mb-4">{t.support_opt1_desc}</p><button onClick={() => window.location.href = t.support_opt1_href} className="block w-full text-center bg-cyan-500 hover:bg-cyan-400 text-gray-900 text-base font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95 cursor-pointer relative z-10">{t.support_opt1_btn}</button></div><div className="bg-gray-800 p-5 rounded-2xl shadow-lg mb-4"><h2 className="text-lg font-bold text-cyan-300 mb-2">{t.support_opt2_title}</h2><p className="text-sm text-gray-300 mb-4">{t.support_opt2_desc}</p><button onClick={() => window.location.href = t.support_opt2_href} className="block w-full text-center bg-cyan-500 hover:bg-cyan-400 text-gray-900 text-base font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95 cursor-pointer relative z-10">{t.support_opt2_btn}</button></div><div className="bg-gray-800 p-5 rounded-2xl shadow-lg mb-4"><h2 className="text-lg font-bold text-cyan-300 mb-2 flex items-center justify-center"><YoutubeIcon /> <span className="ml-2">{t.support_opt_youtube_title}</span></h2><p className="text-sm text-gray-300 mb-4 text-center">{t.support_opt_youtube_desc}</p><button onClick={() => window.open(YOUTUBE_CHANNEL_URL, '_blank')} className="block w-full text-center bg-red-600 hover:bg-red-500 text-white text-base font-bold py-3 rounded-xl shadow-lg transition-transform active:scale-95 cursor-pointer relative z-10">{t.support_opt_youtube_btn}</button></div></div>);


        const ContentScreen = ({ titleKey, subtitleKey, content, onBack }) => (<div className="w-full max-w-sm mx-auto text-left p-4 overflow-y-auto h-full pb-24 fade-in"><button onClick={onBack} className="flex items-center text-cyan-400 hover:text-cyan-300 text-base font-medium mb-4"><ArrowLeftIcon />{t.back_to_menu}</button><h1 className="text-3xl font-extrabold text-white mb-2">{t[titleKey]}</h1><h2 className="text-lg font-semibold text-cyan-300 mb-6">{t[subtitleKey]}</h2><div className="text-base text-gray-200 space-y-4 leading-relaxed">{Array.isArray(content) ? (typeof content[0] === 'string' ? <ul className="list-decimal list-outside pl-5 space-y-2">{content.map((c, i) => <li key={i}>{c}</li>)}</ul> : <ul className="space-y-4">{content.map((c, i) => <li key={i} className="bg-gray-800 p-4 rounded-xl shadow">{c.img && <img src={c.img} alt={c.text} className="w-full h-48 object-contain mb-4 rounded-lg bg-gray-900" />}<strong className="block text-cyan-300 text-lg mb-1">{c.text}</strong><span className="text-sm text-gray-300">{c.desc}</span></li>)}</ul>) : <Fragment><p>{content.p1}</p><p className="font-bold text-white">{content.p2}</p><ul className="list-disc list-outside pl-5 space-y-2"><li>{content.li1}</li><li>{content.li2}</li><li>{content.li3}</li></ul><p className="italic text-cyan-200 mt-4">{content.p3}</p></Fragment>}</div></div>);


        const EntryScreen = ({ onChoose }) => {
            const { isPro, promptProModal } = useBilling();
            return (
                <div className="w-full max-w-sm mx-auto text-center p-6 flex flex-col justify-center h-full fade-in relative">
                    <div className="flex-1 flex flex-col justify-center items-center">
                        <DiverIcon />
                        <h1 className="text-4xl font-extrabold text-white mb-2">{t.entry_title}</h1>
                        <p className="text-gray-400 mb-6">{t.entry_subtitle}</p>
                        
                        <button onClick={() => onChoose('free')} className="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg mb-4 transition-transform hover:scale-105 border border-gray-600">
                            <span className="block text-xl">{t.entry_free_btn}</span>
                            <span className="block text-xs text-gray-400 mt-1 font-normal">{t.entry_free_desc}</span>
                        </button>


                        <button onClick={() => { if(isPro) onChoose('free'); else promptProModal(); }} className={`w-full font-bold py-4 px-6 rounded-xl shadow-lg mb-4 transition-transform hover:scale-105 border ${isPro ? 'bg-emerald-600 border-emerald-400 hover:bg-emerald-500' : 'bg-gradient-to-r from-cyan-600 to-cyan-500 border-cyan-400 hover:from-cyan-500 hover:to-cyan-400'} text-white`}>
                            <span className="block text-xl">{isPro ? t.entry_enter_pro : t.entry_pro_btn}</span>
                            <span className={`block text-xs mt-1 font-normal ${isPro ? 'text-emerald-100' : 'text-cyan-100'}`}>{isPro ? 'Unlocked' : t.entry_pro_desc}</span>
                        </button>


                        <button onClick={() => window.open(YOUTUBE_CHANNEL_URL, '_blank')} className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform hover:scale-105 flex items-center justify-center gap-2 border border-red-400">
                            <YoutubeIcon />
                            <span>{t.entry_youtube_btn}</span>
                        </button>
                    </div>
                    <div className="text-xs text-gray-500 mt-4">Dive Breathe: Scuba Tools</div>
                </div>
            );
        };


        const App = () => {
            const [activeScreen, setActiveScreen] = useState('entry'); 
            const [subScreen, setSubScreen] = useState(null);
            const { isPro, promptProModal } = useBilling();
            const [showLangMenu, setShowLangMenu] = useState(false);


            const handleEntryChoice = (choice) => {
                setActiveScreen('breathe');
            };


            useEffect(() => {
                if (activeScreen === 'entry' && isPro) {
                }
            }, [isPro, activeScreen]);


            const renderScreen = () => {
                if (activeScreen === 'entry') return <EntryScreen onChoose={handleEntryChoice} />;
                if (subScreen) return <ContentScreen titleKey={subScreen === 'why' ? 'why_title' : subScreen === 'basics' ? 'basics_title' : 'signals_title'} subtitleKey={subScreen === 'why' ? 'why_subtitle' : subScreen === 'basics' ? 'basics_subtitle' : 'signals_subtitle'} content={subScreen === 'why' ? {p1:t.why_p1, p2:t.why_p2, li1:t.why_li1, li2:t.why_li2, li3:t.why_li3, p3:t.why_p3} : subScreen === 'basics' ? CONTENT_DATA.basics : CONTENT_DATA.signals} onBack={() => setSubScreen(null)} />;
                switch (activeScreen) {
                    case 'drills': return <DrillsScreen />;
                    case 'tips': return <SpecialtyTipsScreen />;
                    case 'calc': return <CalculatorScreen />;
                    case 'logbook': return <LogbookScreen />;
                    default: return <BreathTrainer onShowWhy={() => setSubScreen('why')} onShowBasics={() => setSubScreen('basics')} onShowSignals={() => setSubScreen('signals')} onShowSupport={() => setActiveScreen('')} />;
                }
            };


            const NavItem = ({ screen, icon, label, locked }) => (
                <button onClick={() => { if (locked && !isPro) promptProModal(); else { setSubScreen(null); setActiveScreen(screen); } }} className={`flex flex-col items-center justify-center pt-2 pb-1 ${activeScreen === screen && !subScreen ? 'text-cyan-400' : 'text-gray-500'}`}>
                    <div className="relative">{React.cloneElement(icon, { className: "w-6 h-6" })}{locked && !isPro && <LockIcon className="absolute -top-1 -right-2 w-3 h-3 text-yellow-400" />}</div>
                    <span className="text-[10px] font-medium mt-1">{label}</span>
                </button>
            );


            return (
                <div className="flex flex-col h-full max-h-full relative overflow-hidden bg-gray-900">
                    <header className="absolute top-0 right-0 h-16 flex items-center px-4 z-40">
                        <button onClick={() => setShowLangMenu(p => !p)} className="text-gray-400 p-2 hover:text-white transition-colors"><GlobeIcon /></button>
                    </header>
                    
                    {showLangMenu && (
                        <div className="lang-menu" onMouseLeave={() => setShowLangMenu(false)}>
                            {LANGUAGES.map(lang => (
                                <a key={lang.code} href={lang.code === "en" ? "#" : "https://play.google.com/store/apps/details?id=com.divebreathe.app"} target={lang.code === "en" ? "_self" : "_blank"} rel="noopener noreferrer" className={`lang-menu-item flex items-center justify-between ${lang.code === "en" ? "active" : ""}`}><span>{lang.name}</span>{lang.code !== "en" && <span className="text-[10px] text-cyan-400 font-normal ml-2">Google Play</span>}</a>
                            ))}
                        </div>
                    )}
                    <ProModal />
                    <main className="flex-1 overflow-y-auto min-h-0 pt-14">{renderScreen()}</main>
                    {activeScreen !== 'entry' && !subScreen && (
                        <nav className="flex-shrink-0 w-full max-w-sm mx-auto grid grid-cols-6 gap-1 bg-gray-900 border-t border-gray-800 pb-safe">
                            <NavItem screen="breathe" icon={<HeartIcon />} label={t.nav_breathe} />
                            <NavItem screen="drills" icon={<ClockIcon />} label={t.nav_drills} locked={true} />
                            <NavItem screen="tips" icon={<LightBulbIcon />} label={t.nav_tips} locked={true} /> 
                            <NavItem screen="calc" icon={<CalculatorIcon />} label={t.nav_calc} locked={true} />
                            <NavItem screen="logbook" icon={<BookIcon />} label={t.nav_logbook} locked={true} />
                        </nav>
                    )}
                </div>
            );
        };


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MessageProvider><BillingProvider><App /></BillingProvider></MessageProvider>);
    </script>
</body>
</html>
